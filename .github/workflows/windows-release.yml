
name: Build Windows EXE and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon "assets/mic-mute.ico" --add-data "assets/mic-mute.ico;assets" --name "Mic Mute for Voicemeeter & Windows" main.py

      - name: Build updater
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon "assets/mic-mute.ico" --name MicMuteUpdater updater.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/Mic Mute for Voicemeeter & Windows.exe" release/
          Copy-Item "dist/MicMuteUpdater.exe" release/
          Compress-Archive -Path "release/*" -DestinationPath "Mic-Mute-Windows-${{ github.ref_name }}.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Mic-Mute-Windows-${{ github.ref_name }}.zip
          generate_release_notes: true
 
